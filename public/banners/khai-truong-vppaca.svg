  <circle cx="1080" cy="80" r="120" fill="#fff" fill-opacity="0.06"/>
  <text x="80" y="120" fill="#FFF8E7" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="4">MUNG KHAI TRUONG</text>
  <text x="80" y="200" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">VPPACA &#183; ACA</text>
  <text x="80" y="268" fill="#FFF8E7" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Van phong pham B2C &amp; B2B &#183; vppaca.vn</text>
  <rect x="80" y="300" width="480" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="320" y="335" fill="#EC2229" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Uu dai don dau &#183; Giao nhanh toan quoc</text>
