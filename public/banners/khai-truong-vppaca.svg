<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 420" role="img" aria-label="Mung khai truong VPPACA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1260" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EC2229"/>
      <stop offset="0.55" stop-color="#E85A2A"/>
      <stop offset="1" stop-color="#EDA909"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC2229" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#C92A22" stop-opacity="0.75"/>
      <stop offset="0.72" stop-color="#E85A2A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EDA909" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="heroPhoto">
      <rect x="640" y="0" width="620" height="420" rx="0"/>
    </clipPath>
    <clipPath id="cardA">
      <rect x="720" y="240" width="200" height="150" rx="16"/>
    </clipPath>
    <clipPath id="cardB">
      <rect x="960" y="200" width="180" height="140" rx="16"/>
    </clipPath>
  </defs>
  <rect width="1260" height="420" fill="url(#bg)"/>
  <g clip-path="url(#heroPhoto)">
    <image href="/products/bia-ho-so.jpg" x="580" y="0" width="720" height="480" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g clip-path="url(#cardA)">
    <image href="/products/giay-a4-ream-01.jpg" x="720" y="220" width="220" height="180" preserveAspectRatio="xMidYMid slice"/>
