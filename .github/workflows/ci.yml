name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          USE_SUPABASE: "false"
          ADMIN_EMAIL: admintamduc
          ADMIN_PASSWORD: admin123
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
